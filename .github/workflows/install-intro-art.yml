name: Install intro artwork

on:
  push:
    branches: [main]
    paths:
      - '.asset-upload/READY'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct high-quality images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/art
          cat .asset-upload/webp-family/chunk-* | base64 -d > public/art/shalt-family-final.webp
          cat .asset-upload/webp-mother/chunk-* | base64 -d > public/art/shalt-mother-farewell-final.webp
          echo "1176f1b541d3e24ba118883bda304e4afb5dd1f1d72b4173e0666024b6971659  public/art/shalt-family-final.webp" | sha256sum -c -
          echo "3e0616d5a963f2da85690294f8854aef0e14f7820fc4b08a84cc9ba6dc4e60ca  public/art/shalt-mother-farewell-final.webp" | sha256sum -c -
          rm -rf .asset-upload
          rm -f .github/workflows/install-intro-art.yml
      - name: Commit binary assets
        run: |
          git config user.name "Shalt automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Install high-quality intro artwork"
          git push origin HEAD:main
